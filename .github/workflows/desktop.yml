# Đóng gói app Windows (Get Helps Setup x.y.z.exe) và đăng lên GitHub Releases; app đã cài tự cập nhật từ đây.
# Chạy: tăng "version" trong desktop/package.json, push lên main (hoặc bấm Run workflow ở tab Actions).
name: Desktop app
on:
  push:
    branches: [main]
    paths: ['desktop/package.json', 'extension/chatgpt-connector/**']
  workflow_dispatch:
permissions:
  contents: write
# Đẩy nhiều bản liên tiếp: huỷ lượt build cũ đang chạy, chỉ build bản mới nhất (tránh bản cũ build xong sau lại thành "mới nhất").
concurrency:
  group: desktop-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # GitHub chỉ cho đăng bản phát hành có tag sẵn.
      - shell: bash
        run: v=v$(node -p "require('./package.json').version"); git tag -f $v; git push -f origin $v
      # Tạo sẵn bản phát hành dạng nháp: electron-builder tải nhiều file song song (nếu chưa có thì tạo trùng 2 bản);
      # để nháp tới khi tải xong hết, app đã cài không thấy bản mới thiếu file.
      - shell: bash
        run: v=v$(node -p "require('./package.json').version"); gh release view $v >/dev/null 2>&1 || gh release create $v --draft --title "Meta Assistant $v" --notes "Bản Windows $v"
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: npx electron-builder --win nsis --publish always
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - shell: bash
        # Chỉ đánh dấu "mới nhất" nếu trên main không có bản nào mới hơn bản vừa build.
        run: |
          v=$(node -p "require('./package.json').version")
          git fetch -q origin main
          head=$(git show origin/main:desktop/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$v" = "$head" ]; then gh release edit v$v --draft=false --latest; else gh release edit v$v --draft=false --latest=false; fi
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
