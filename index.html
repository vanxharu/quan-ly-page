<header class="header">
  <div class="header-in">
    <div class="header-top">
      <div class="logo">
        <span class="logo-badge"><img src="extension/chatgpt-connector/icons/logo.png?v=20261105-robot1" alt="" width="34" height="34"></span>
        <h1 class="app-title">Meta Assistant</h1>
        <span class="pro-tag">WEB</span>
        <span class="dot" id="dot" title="Chưa đăng nhập"></span>
      </div>
      <div class="page-picker" id="pagePicker" hidden>
        <button type="button" class="page-btn" id="pageBtn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="page-menu" id="pageMenu" hidden></div>
      </div>
      <button class="icon-btn" id="btnDark" title="Chuyển chế độ Sáng / Tối" aria-label="Chuyển chế độ Sáng / Tối"><svg class="ico"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="btnLogout" title="Đăng xuất khỏi trang" aria-label="Đăng xuất khỏi trang" hidden><svg class="ico"><use href="#i-out"/></svg></button>
    </div>
    <nav class="tab-nav" id="nav" aria-label="Điều hướng chức năng" hidden>
      <div class="groups" id="groups"></div>
      <div class="subnav" id="subnav" role="tablist"></div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="card login" id="login">
    <div class="logo-big"><span class="logo-badge"><img src="extension/chatgpt-connector/icons/logo.png?v=20261105-robot1" alt="" width="34" height="34"></span></div>
    <h2>Meta Assistant</h2>
    <p class="muted">Quản lý Page bằng Graph API: Hộp thư, mẫu tin, khách hàng, đăng &amp; hẹn lịch bài, bình luận, số liệu, bán hàng.</p>
    <button class="btn btn-fb" id="fbLogin" disabled>Đăng nhập bằng Facebook</button>
    <p class="hint" id="loginStatus" style="margin-top:12px">Đang tải Facebook SDK…</p>
    <details>
      <summary>Tuỳ chọn khác</summary>
      <div class="row" style="margin-top:10px">
        <input class="grow" type="text" id="appId" placeholder="App ID" inputmode="numeric">
        <button class="btn btn-ghost" id="saveApp">Lưu App ID</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input class="grow" type="password" id="token" placeholder="Dán User Access Token (Graph API Explorer)">
        <button class="btn btn-ghost" id="useToken">Dùng token</button>
      </div>
    </details>
  </section>
</main>
